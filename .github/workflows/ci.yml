name: CI

# Stage 1 (Foundation) exit criterion: "CI operational" —
# 01-Product/04-Product-Roadmap.md, Section 6.
#
# No Postgres service container yet: Stage 1's test suite is DTO validation +
# guard unit tests only, none of which touch a live database. Add one here
# when the first integration/e2e test that needs a real connection is written.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    env:
      DATABASE_URL: "postgresql://agriai:agriai_ci_password@localhost:5432/agriai?schema=public"
      JWT_ACCESS_SECRET: "ci-access-secret"
      JWT_REFRESH_SECRET: "ci-refresh-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run build
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npm run build
