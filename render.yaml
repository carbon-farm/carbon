# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect this repo on Render ("New" -> "Blueprint"), and it reads this file
# automatically: no manual service configuration beyond the secrets below.
#
# Secrets (DATABASE_URL, DIRECT_URL, JWT_*) are deliberately NOT set here —
# "sync: false" means Render prompts for them once in its dashboard instead
# of them ever living in this committed file.

services:
  - type: web
    name: carbon-backend
    runtime: node
    plan: free
    rootDir: app/backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
