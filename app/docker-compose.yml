# AgriAI Platform local dev ports are fixed to 7000-7050 for this project —
# see app/README.md's Port Allocation table. Backend: 7000, Web: 7001,
# Postgres: 7002 (here), Redis: 7003 (here). 7004-7050 reserved for future
# services (Case Management worker, WhatsApp webhook receiver, etc.).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agriai
      POSTGRES_PASSWORD: agriai_dev_password
      POSTGRES_DB: agriai
    ports:
      - "7002:5432"
    volumes:
      - agriai_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "7003:6379"

volumes:
  agriai_postgres_data:
